name: CI

on:
  pull_request:

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stage non-secret test config
        run: |
          cp appsettings.Test.ci.json appsettings.Test.json
          cp baseball_password.ci.txt baseball_password.txt

      - name: Run API tests
        env:
          # The only genuinely secret values; everything else is committed in
          # the .ci files above. compose.yaml forwards these into the container,
          # where AddEnvironmentVariables() overrides the JSON's Spaces section.
          Spaces__AccessKey: ${{ secrets.SPACES_ACCESS_KEY }}
          Spaces__SecretKey: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          docker compose --profile test run --remove-orphans --rm baseball-api-dev \
            dotnet test /source --filter="Category!=Media"

  swift-tests:
    name: Swift Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stage non-secret test config
        run: |
          cp appsettings.Test.ci.json appsettings.Test.json
          cp baseball_password.ci.txt baseball_password.txt

      - name: Run Swift tests
        run: |
          docker compose --profile swift-test run --remove-orphans --rm swift-tests

  schema-drift:
    name: Swift Test Schema Up To Date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet tool install --global dotnet-ef --version 10.*

      # The Swift tests build their scratch databases from a committed copy of the
      # API's schema. Regenerate it here so adding a migration without refreshing
      # that copy fails the PR rather than silently testing a stale schema.
      - name: Check schema.sql matches the EF migrations
        # dotnet-ef 10 reads project metadata before its own build/restore, so it
        # fails on a fresh checkout (NETSDK1004: project.assets.json not found).
        run: |
          dotnet restore BaseballApi/Api
          dotnet ef migrations script --idempotent --context BaseballContext \
            --project BaseballApi/Api --output /tmp/schema.sql
          diff -u iScoreImport/Tests/iScoreImportTests/Resources/schema.sql /tmp/schema.sql

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baseball-app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: baseball-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
