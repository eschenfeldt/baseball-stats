name: Deploy

# Continuous deployment: on merge to main, run the existing manual
# deploy sequence on the server over SSH (reached via the tailnet). The
# migration gate guarantees any new migrations are already applied before the
# merge that triggers this, so the deployed code never races ahead of the schema.
on:
  push:
    branches: [main]

# Never let two deploys run at once; queue them instead of cancelling so an
# in-flight down/up sequence always completes.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write # Tailscale OIDC 

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    steps:
      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
            oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
            audience: ${{ secrets.TS_AUDIENCE }}
            tags: tag:ci-cd

      - name: Deploy over SSH
        # Auth is handled by Tailscale SSH (the runner connects as the ACL-
        # authorized tag:ci-cd node) — no SSH key to manage. accept-new trusts the
        # host key on first connect.
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_SSH_USER }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            cd ~/source/baseball-stats
            git pull --ff-only
            export GIT_SHA="$(git rev-parse --short HEAD)"
            export HOST_NAME="$(hostname)" HOST_ID="$(cat /etc/machine-id)"
            docker compose --profile prod down
            docker compose --profile prod up -d --build
            docker image prune -f
          '
