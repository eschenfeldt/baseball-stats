services:

  baseball-api-dev:
    build:
      context: BaseballApi
      target: development
      secrets:
        - app_settings
    restart: always
    image: baseball-api
    depends_on:
      db:
        condition: "service_healthy"
    develop:
      watch:
        - action: rebuild
          path: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - app_settings
    profiles:
      - test
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Forwarded from the host only when set (e.g. CI). Locally these stay
      # unset so the mounted app_settings secret provides Spaces credentials.
      - Spaces__AccessKey
      - Spaces__SecretKey
    cpus: '0.7'
    mem_limit: 2G
    mem_reservation: 128M
    memswap_limit: 12G
    volumes:
      - app-logs:/app/logs

  baseball-api:
    build:
      context: BaseballApi
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: always
    image: baseball-api
    profiles:
      - prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Host/cloud resource attributes are derived from the VM metadata service by
      # deploy.yml; the OTel SDK merges OTEL_RESOURCE_ATTRIBUTES into the resource.
      # NOTE: do NOT change this to a bare `- OTEL_RESOURCE_ATTRIBUTES` pass-through.
      # The docker CLI overrides OTEL_RESOURCE_ATTRIBUTES in its own environment with
      # its telemetry value (docker.cli.cobra.command_path=...), so a pass-through
      # forwards Docker's value into the container, not ours. deploy.yml carries the
      # value in HOST_RESOURCE_ATTRS (which Docker leaves alone) and we map it back
      # in here. See docker/cli#4958.
      - OTEL_RESOURCE_ATTRIBUTES=${HOST_RESOURCE_ATTRS}
    cpus: '0.7'
    mem_limit: 2G
    mem_reservation: 128M
    memswap_limit: 12G
    volumes:
      - app-logs:/app/logs

  app:
    build:
      context: baseball-app
    restart: always
    image: eschenfeldt/baseball-app
    profiles:
      - prod
    depends_on:
      - baseball-api

  proxy:
    build: proxy
    restart: always
    ports:
      - 80:80
      - 443:443
    depends_on:
      - baseball-api
      - app
    image: baseball-gateway
    profiles:
      - prod
    volumes:
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt:ro
      - web-root:/var/www/html:ro
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    container_name: certbot
    profiles:
      - prod
    volumes:
      - certbot-etc:/etc/letsencrypt:rw
      - certbot-var:/var/lib/letsencrypt:rw
      - web-root:/var/www/html:rw
    depends_on:
      - proxy
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # Runs the iScoreImport Swift tests against the db service below. The tests build
  # their own scratch database per test from Tests/iScoreImportTests/Resources/schema.sql,
  # so nothing needs seeding first.
  swift-tests:
    image: swift:6.4-noble
    profiles:
      - swift-test
    depends_on:
      db:
        condition: "service_healthy"
    working_dir: /source
    volumes:
      - ./iScoreImport:/source
      # Anonymous volume: keeps the container's build output (and its root ownership)
      # out of the host working tree, where a macOS .build already lives.
      - /source/.build
    secrets:
      - baseball_password
    environment:
      ISCORE_TEST_PG_HOST: db
      ISCORE_TEST_PG_PORT: "5432"
      ISCORE_TEST_PG_PASSWORD_FILE: /run/secrets/baseball_password
      # Deliberately not US Eastern, so a timezone-dependent expectation fails here
      # rather than only on someone else's machine.
      TZ: UTC
    command: ["swift", "test"]

  db:
    # Pinned to match the production server's patch version (Debian bookworm's
    # postgresql-15).
    image: postgres:15.19
    profiles:
      - test
      - swift-test
    ports:
      - 5433:5432
    restart: always
    user: postgres
    environment:
      POSTGRES_USER: baseball owner
      POSTGRES_DB: Baseball
      POSTGRES_PASSWORD_FILE: /run/secrets/baseball_password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d Baseball -U 'baseball owner'" ]
      interval: 1s
      timeout: 5s
      retries: 10
    secrets:
      - baseball_password

volumes:
  certbot-etc:
  certbot-var:
  web-root:
  app-logs:


secrets:
  app_settings:
    file: ./appsettings.Test.json
  baseball_password:
    file: ./baseball_password.txt
